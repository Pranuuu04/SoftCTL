<div class="container">
    <div class="row" style="border-bottom: 1px solid #d2d2d2;">
      <div class="col-sm-12">
        <h2 mat-dialog-title class="mt-2 pb-2"><b>Confirmation</b></h2>
      </div>
    </div>
    <div class="row">
      <div class="col-sm-12">
        <mat-dialog-content class="mt-3 mb-1"><i class="fa-solid fa-circle-info" style="font-size: x-large;"></i>
          {{ data.message }}</mat-dialog-content>
      </div>
    </div>
     <div class="row mt-2" *ngIf="data.inputRequired">
    <div class="col-sm-12">
      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Enter reason</mat-label>
        <textarea matInput rows="3" [(ngModel)]="reason"></textarea>
      </mat-form-field>
    </div>
  </div>
    <div class="row">
      <div class="col-sm-12">
        <mat-dialog-actions style="justify-content: right;">
          <button mat-raised-button (click)="onConfirmClick()" color="Primary">{{ confirmButtonText }}</button>
          <button mat-raised-button (click)="onCancelClick()" color="warn">{{ cancelButtonText }}</button>
        </mat-dialog-actions>
      </div>
    </div> 
</div>
