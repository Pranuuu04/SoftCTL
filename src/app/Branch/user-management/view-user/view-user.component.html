<div class="main-content">
  <div class="container-fluid" style="padding-top: 51px;">
      <div class="row">
          <div class="col-md-12">
              <mat-tab-group mat-stretch-tabs class="example-stretched-tabs mat-elevation-z4">
                  <mat-tab label="User-List">                   
                    <div class="table-responsive">
                      <div class="row d-flex m-0" style="justify-content: right;" >
                        <div class="form-group has-search col-sm-3">
                          <button class="btn btn-secondary" type="button" style="z-index: 1001;
                          position: absolute;
                          background: none;
                          top: -4px;
                          width: 38px;
                          height: 30px;
                          border-top-left-radius: 10px;
                          border-bottom-left-radius: 10px;
                          background-color: #2e3f55;">
                            <i class="fa fa-search" style="color:  #a3b8d4; margin-top: -24px;"></i>
                          </button>
                          <input type="text" class="form-control" placeholder="Search.."  id="Filter" #input (keyup)="applyFilter($event.target.value)" style="border-radius: 11px; margin: 0px 0 0; box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px; height: 32px; padding-left: 48px;">
                        </div>
                      </div>
                    </div>
                    <div class="table-responsive text-nowrap" style="overflow-x: visible;">
                        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table-bordered table-striped" style="background-color: #e2e9f1;">

                          <ng-container matColumnDef="Username">
                          <th mat-header-cell *matHeaderCellDef> Username </th>
                          <td mat-cell *matCellDef="let element"> {{element.Username}} </td>
                        </ng-container>

                        <ng-container matColumnDef="UserType">
                          <th mat-header-cell *matHeaderCellDef> User Type </th>
                          <td mat-cell *matCellDef="let element"> {{element.UserType}} </td>
                        </ng-container>     
                    
                        <ng-container matColumnDef="Action">
                          <th mat-header-cell *matHeaderCellDef> Action </th>
                          <td mat-cell *matCellDef="let element" style="display: flex; justify-content: space-around;">
                            <button mat-icon-button color="primary" (click)="openUserEditModal(element.Username)">
                              <mat-icon matTooltip="Change Password" style="margin-top: -9px; font-size: 22px;"> vpn_key</mat-icon>
                            </button>
                            <!-- [disabled]="element.Username === UserName" -->
                            <button mat-icon-button color="warn" (click)="deleteList(element.Username)">
                              <mat-icon matTooltip="Delete" style="margin-top: -9px; font-size: 22px;">delete</mat-icon>
                            </button>
                          </td>
                        </ng-container>
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                      </table>
                    </div>
                    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>
                  </mat-tab> 
              </mat-tab-group>
          </div>
      </div>
  </div>
</div>
