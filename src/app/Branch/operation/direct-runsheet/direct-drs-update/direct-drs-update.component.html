  <div class="row">
    <div class="col-sm-6">
        <div class="custom-field">
         <input type="text" id="drsNumber" formControlName="drsNumber" required placeholder=" "/>
         <label for="drsNumber">DRS Number</label>
        </div>
    </div>

    <div class="col-sm-6">
        <div class="custom-field">
         <input type="date" id="drsDate" formControlName="drsDate" required placeholder=" "/>
         <label for="drsDate">DRS Date</label>
        </div>
    </div>
  </div>

 <div class="row mt-4">
   <div class="col-sm-6">
    <div class="file-upload">
      <label class="upload-label">DRS Upload (Image)</label>
      <button mat-stroked-button color="primary" (click)="fileInput.click()" type="button">
        <mat-icon>upload</mat-icon> Choose File
      </button>
      <input type="file" #fileInput (change)="onFileSelected($event)" hidden />
      <div *ngIf="previewImage" class="preview">
        <img [src]="previewImage" alt="Preview" />
      </div>
    </div>
   </div>

   <div class="col-sm-6 mt-4 d-flex justify-content-end align-items-center">
    <button mat-raised-button color="accent" type="submit" class="submit-btn">
      SUBMIT
    </button>
  </div>

  </div>

  </form>
</div>
