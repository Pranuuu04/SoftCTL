<div class="container-fluid">

  <div class="pending-count mt-1" style=" border-bottom: 1px solid #d2d2d2;">
    <span>Pending Drs <strong>:</strong></span>
    <span class="count">{{ pendingDrsCount }}</span>
  </div>

<form [formGroup]="drsForm" (ngSubmit)="onSubmit()" class="drs-form">

  <div class="row ">
    <div class="col-sm-4 mt-1">
        <div class="custom-field">
           <label for="drsNumber">DRS Number:</label>
         <input type="text" id="drsNumber" formControlName="drsNumber" required placeholder="Enter Drs Number"/>
        </div>
    </div>

    <!-- <div class="col-sm-6">
        <div class="custom-field">
         <input type="date" id="drsDate" formControlName="drsDate" required placeholder=" "/>
         <label for="drsDate">DRS Date</label>
        </div>
    </div> -->

<div class="col-sm-4 mt-3 d-flex justify-content-start" style="padding-left: 20px;">
  <div class="file-upload w-100">
    <label for="drsNumber">DRS Image:</label>
    <div class="custom-file-box">
      <input type="text" class="file-display-box" [value]="selectedFileName" placeholder="Upload Image or PDF" readonly (click)="fileInput.click()"/>
      <button class="upload-icon-btn" (click)="fileInput.click()" type="button">
        <i class="fa fa-upload"></i>
      </button>
      <input type="file" #fileInput accept="image/png, image/jpeg, application/pdf" (change)="onFileSelected($event)" hidden/>
    </div>
  </div>
</div>

  </div>

</div>
