<div class="table-responsive">
  <div class="row d-flex m-0" style="justify-content: right;" >
    <div class="form-group has-search col-sm-3 mt-0" style="padding-bottom: 4px;">
      <button class="btn btn-secondary" type="button" style="z-index: 1001;
      position: absolute;
      background: none;
      padding: 0px 0px;
      height: 26px;
      margin: 0 1px;
      top: -1px;
      left: 21px;">
        <i class="fa fa-search" style="color: #d2d2d2;"></i>
      </button>
      <input type="text" class="form-control" placeholder="Search"  id="Filter" #input  (keyup)="applyFilter($event)" style="padding-left: 32px; border-radius: 1.25rem; margin: 0px 0 0;">
    </div>
   </div>
</div>

<div class="table-responsive text-nowrap">
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" class="table-bordered table-striped ">
  
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef> S.No. </th>
        <td mat-cell *matCellDef="let element"> {{element.position}} </td>
      </ng-container>
  
      <ng-container matColumnDef="AwbNo">
        <th mat-header-cell *matHeaderCellDef> AWB No </th>
        <td mat-cell *matCellDef="let element"> {{element.AwbNo}} </td>
      </ng-container>
  
      <ng-container matColumnDef="Date">
        <th mat-header-cell *matHeaderCellDef> Date </th>
        <td mat-cell *matCellDef="let element"> {{element.Date}} </td>
      </ng-container>
  
      <ng-container matColumnDef="Consigner">
        <th mat-header-cell *matHeaderCellDef> Consigner </th>
        <td mat-cell *matCellDef="let element"> {{element.Consigner}} </td>
      </ng-container>
  
      <ng-container matColumnDef="Consignee">
        <th mat-header-cell *matHeaderCellDef> Consignee </th>
        <td mat-cell *matCellDef="let element"> {{element.Consignee}} </td>
      </ng-container>
  
      <ng-container matColumnDef="FromDst">
        <th mat-header-cell *matHeaderCellDef> FromDst </th>
        <td mat-cell *matCellDef="let element"> {{element.FromDst}} </td>
      </ng-container>
  
      <ng-container matColumnDef="ToDst">
        <th mat-header-cell *matHeaderCellDef> Destination </th>
        <td mat-cell *matCellDef="let element"> {{element.ToDst}} </td>
      </ng-container>
  
      <ng-container matColumnDef="PCs">
        <th mat-header-cell *matHeaderCellDef> PCs </th>
        <td mat-cell *matCellDef="let element"> {{element.PCs}} </td>
      </ng-container>
  
      <ng-container matColumnDef="Weight">
        <th mat-header-cell *matHeaderCellDef> Weight </th>
        <td mat-cell *matCellDef="let element"> {{element.Weight}} </td>
      </ng-container>
  
      <ng-container matColumnDef="Action">
        <th mat-header-cell *matHeaderCellDef> Action </th>
        <td mat-cell *matCellDef="let element"> {{element.Action}} </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons
                   aria-label="Select page of periodic elements">
    </mat-paginator>
  </div>
</div>
