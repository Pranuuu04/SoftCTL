
<div class="table-responsive">
  <div class="row d-flex m-0" style="justify-content: right;" >
    <div class="form-group has-search col-sm-3">
      <button class="btn btn-secondary" type="button" style="z-index: 1001;
      position: absolute;
      background: none;
      top: -4px;
      width: 38px;
      height: 32px;
      border-top-left-radius: 10px;
      border-bottom-left-radius: 10px;
      background-color: orange;">
        <i class="fa fa-search" style="color: white; margin-top: -24px;"></i>
      </button>
      <input type="text" class="form-control" placeholder="Search.."  id="Filter" #input (keyup)="applyFilter($event.target.value)" style="border-radius: 11px; margin: 0px 0 0; box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px; height: 32px; padding-left: 48px;">
    </div>
   </div>
</div>

<div class="table-responsive text-nowrap">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table-bordered table-striped" style="background-color: rgb(223 233 237 / 87%);">

      <ng-container matColumnDef="ComplainNo">
      <th mat-header-cell *matHeaderCellDef> ComplainNo </th>
      <td mat-cell *matCellDef="let element"> {{element.ComplainNo}} </td>
    </ng-container>

    <ng-container matColumnDef="awbno">
      <th mat-header-cell *matHeaderCellDef> Awbno </th>
      <td mat-cell *matCellDef="let element"> {{element.awbno}} </td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Date </th>
      <td mat-cell *matCellDef="let element"> {{element.date | date:'dd/MM/yyyy'}} </td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef> Type </th>
      <td mat-cell *matCellDef="let element"> {{element.type}} </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element"> {{element.status}} </td>
    </ng-container>

    <ng-container matColumnDef="Action">
      <th mat-header-cell *matHeaderCellDef> Action </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="warn" (click)="deleteComplain(element.ComplainNo)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
<mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>
