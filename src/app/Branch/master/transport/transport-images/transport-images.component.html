<div class="container" style="max-height: 400px;">
    <div class="row" style="border-bottom: 1px solid #d2d2d2;">
      <div class="col-sm-6">
        <h1 style="font-weight: 600;
        font-size: large;
        margin-bottom: 0;
        margin-top: 7px; ">Image View</h1>
      </div>
        <div class="col-sm-6 d-flex cancel" style="justify-content: right;">
            <button type="button" class="btn btn-light" download (click)="downloadImage()" style="width: 30px;
            text-align: center;
            line-height: 30px;
            height: 30px;
            font-weight: 500;
            font-size: large;
            background: rgb(0, 174, 255);
            color: white;">
         <i class="fa fa-download"></i>
       </button>
     <button type="button" class="btn btn-light" (click)="CloseDialog()" style="width: 30px;
        text-align: center;
        line-height: 30px;
        height: 30px;
        font-weight: 500;
        font-size: large;
        background: red;
        margin-left: 10px;
        color: white;">X</button>
        
       <!-- <a href="javascript:void(0);" (click)="downloadImage()" download class="download-btn" style="padding: 5px;">
        <i class="fa fa-download img-icon"></i>
        <span>Pdf</span>
      </a> -->
       
    </div>
</div>

<div class="row" style="border-bottom: 1px solid #d2d2d2;">
    <div class="col" style="border: 1px solid #d2d2d2;">
        <div class="row">
              <div class="col-sm-12">
                  <img [src]="getBase64Image()" alt="Image Not Found" class="img-fluid" />
              </div>
        </div>
    </div>
</div>
