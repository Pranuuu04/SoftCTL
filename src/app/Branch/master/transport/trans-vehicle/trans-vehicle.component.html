 <!-- <div *ngIf="showTable && dataSource.data.length > 0"> -->
    <div class="table-responsive">
        <div class="row d-flex m-0" style="justify-content: right;" >
          <div class="form-group has-search col-sm-3">
            <button class="btn btn-secondary" type="button" style="z-index: 1001;
            position: absolute;
            background: none;
            top: -3px;
            width: 38px;
            height: 30px;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            background-color: #2e3f55;">
              <i class="fa fa-search" style="color:  #a3b8d4; margin-top: -24px;"></i>
            </button>
            <input type="text" class="form-control" placeholder="Search.."  id="Filter" #input (keyup)="applyFilter($event.target.value)" style="border-radius: 11px; margin: 0px 0 0; box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px; height: 32px; padding-left: 48px;">
          </div>
        </div>
      </div>
      <div class="table-responsive text-nowrap">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table-bordered table-striped" style="background-color: #e2e9f1;">
  
          <ng-container matColumnDef="Registration_Date">
            <th mat-header-cell *matHeaderCellDef> Registration Date </th>
            <td mat-cell *matCellDef="let element">{{element.Registration_Date}} </td>
          </ng-container>
  
          <ng-container matColumnDef="Vehicle_No">
            <th mat-header-cell *matHeaderCellDef>Vehicle No </th>
            <td mat-cell *matCellDef="let element"> {{element.Vehicle_No}} </td>
          </ng-container>

          <ng-container matColumnDef="Vehicle_Name">
            <th mat-header-cell *matHeaderCellDef>Vehicle Name </th>
            <td mat-cell *matCellDef="let element"> {{element.Vehicle_Name}} </td>
          </ng-container>

          <ng-container matColumnDef="vehicletypeName">
            <th mat-header-cell *matHeaderCellDef>Vehicle Type </th>
            <td mat-cell *matCellDef="let element"> {{element.vehicletypeName}} </td>
          </ng-container>

          <ng-container matColumnDef="Transport_Type">
            <th mat-header-cell *matHeaderCellDef>Transport Type </th>
            <td mat-cell *matCellDef="let element"> {{element.Transport_Type}} </td>
          </ng-container>

          <ng-container matColumnDef="Transport_Name">
            <th mat-header-cell *matHeaderCellDef>Transport Name </th>
            <td mat-cell *matCellDef="let element"> {{element.Transport_Name}} </td>
          </ng-container>

          <ng-container matColumnDef="imageIcon">
            <th mat-header-cell *matHeaderCellDef>Images</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button matTooltip="Registration Image" (click)="onImageIconClick(element.Image1)" style="color:  rgb(108, 114, 226);"><mat-icon>image</mat-icon></button>
              <button mat-icon-button matTooltip="Vehicle Image" (click)="onImageIconClick(element.Image2)" style="color:  rgb(108, 114, 226);"><mat-icon>image</mat-icon></button>
            </td>
          </ng-container>
  
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>
              <button mat-mini-fab color="primary" aria-label="Example icon button with a menu icon" (click)="vehicleEntryForm()">
                <mat-icon>add</mat-icon>
              </button> </th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item  (click)="vehicleEntryForm(element)">
                  <mat-icon style="color: green;">edit</mat-icon>
                  <span style="color: green;">edit</span>
                </button>
                <button mat-menu-item  (click)="vehicleDeleteForm(element)">
                  <mat-icon style="color: red;">delete</mat-icon>
                  <span style="color: red;">delete</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
        </table>
    </div>
    <mat-paginator [pageSizeOptions]="[10, 25, 100]" showFirstLastButtons></mat-paginator>
