<!-- <div class="container"> -->
    <form [formGroup]="createForm">
      <div class="row mainrow" style="border-bottom: 1px solid #d2d2d2;">
        <div class="col-sm-5">
            <div class="textOnSelect">
                <label for="CustomerName">Customer name :</label>
                <ng-select 
                  class="custom-select1"
                  [items]="CustomerList"
                  bindLabel="customerName"
                  bindValue="customerCode"
                  formControlName="CustomerName"
                  [searchable]="true"
                  [clearable]="true">
                </ng-select>
                <div *ngIf="createForm.get('CustomerName')?.touched && createForm.get('CustomerName')?.invalid" class="text-danger">
                  Customer name is required.
                </div>        
            </div>
        </div>
          <div class="col-sm-2">
            <div class="textOnSelect">
                <label for="supplierName">Supplier name :</label>
                <ng-select 
                  class="custom-select1"
                  [items]="supplierList"
                  bindLabel="shipperName"
                  bindValue="shipperCode"
                  formControlName="supplierName"
                  [searchable]="true"
                  [clearable]="true">
                </ng-select>
                <div *ngIf="createForm.get('supplierName')?.touched && createForm.get('supplierName')?.invalid" class="text-danger">
                  Supplier name is required.
                </div>        
            </div>
        </div>
        <div class="col-sm-2">
                     <div class="textOnSelect">
              <label class="inputType">type</label>
              <select class="custom-select" formControlName="inputType">
                <option value="Deliverd" selected>Deliverd</option>
                <option value="Pickup"> Pickup</option>
              </select>
            </div>
        </div>
         <div class="col-sm-3">
          <div class="textOnInput">
              <label for="Import">Import :</label>
              <input class="form-control" type="file" #fileInput id="Import" style="padding-left: 0px;padding-top: 8px;" accept=".xlsx, .xls" (change)="onFileSelected($event)">
              <div *ngIf="!selectedFile && createForm.touched" class="text-danger">
                File is required.
              </div>
          </div>
      </div>
    </div>
     <div class="row mainrow" style="border-bottom: 1px solid #d2d2d2;">
      <div class="col-sm-12 d-flex form-group" style="justify-content: end;">
        <button type="button" class="btn btn-light other-button" [disabled]="createForm.invalid" 
  (click)="onSearch()">Search</button>
        <button type="submit" class="btn btn-light other-button" (click)="processExcelData(selectedFile)">Submit</button>
        <button type="button" class="btn btn-success download" (click)="generateExcel()" matTooltip="Download excel">
          <i class="fa-solid fa-download"></i>
        </button>
        <button type="button" class="btn btn-danger error" tabindex="-1" matTooltip="Error log"  (click)="generateLatLongErrorLog()">
          <mat-icon >error</mat-icon>
        </button>
      </div>
    </div>
    </form>
  
<div class="row mainrow">
<div class="col-sm-12 mt-2 p-0">
<div *ngIf="showTable && dataSource.data.length > 0">
  <div class="table-responsive">
        <div class="row d-flex m-0" style="justify-content: right;" >
          <div class="form-group has-search col-sm-3">
            <button class="btn btn-secondary" type="button" style="z-index: 1001;
            position: absolute;
            background: none;
            top: -3px;
            width: 38px;
            height: 30px;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            background-color: #2e3f55;">
              <i class="fa fa-search" style="color:  #a3b8d4; margin-top: -4px;"></i>
            </button>
            <input type="text" class="form-control" placeholder="Search.."  id="Filter" #input 
  (input)="applySearch($event.target.value)"  style="border-radius: 11px; margin: 0px 0 0; box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px; height: 32px; padding-left: 48px;">
          </div>
        </div>
      </div>
  <div class="table-responsive text-nowrap">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table-bordered table-striped" style="background-color: #e2e9f1;">

        <ng-container matColumnDef="ID">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let element"> {{ element.ID }} </td>
        </ng-container>

        <ng-container matColumnDef="Customer_Code">
          <th mat-header-cell *matHeaderCellDef> Customer </th>
          <td mat-cell *matCellDef="let element"> {{ element.Customer_Code }} </td>
        </ng-container>

        <ng-container matColumnDef="Supplier_Code">
          <th mat-header-cell *matHeaderCellDef> Supplier </th>
          <td mat-cell *matCellDef="let element"> {{ element.Supplier_Code }} </td>
        </ng-container>

        <ng-container matColumnDef="DestinationCode">
          <th mat-header-cell *matHeaderCellDef> Destination Code </th>
          <td mat-cell *matCellDef="let element"> {{ element.DestinationCode }} </td>
        </ng-container>

        <ng-container matColumnDef="DestinationName">
          <th mat-header-cell *matHeaderCellDef> Destination Name </th>
          <td mat-cell *matCellDef="let element"> {{ element.DestinationName }} </td>
        </ng-container>

        <ng-container matColumnDef="Lat_Long">
          <th mat-header-cell *matHeaderCellDef> Lat/Long </th>
          <td mat-cell *matCellDef="let element"> {{ element.Lat_Long }} </td>
        </ng-container>
        
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
  <mat-paginator
    [length]="length"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [showFirstLastButtons]="showFirstLastButtons"
    [hidePageSize]="hidePageSize"
    [disabled]="disabled"
    (page)="handlePageEvent($event)">
  </mat-paginator>
  </div>
  <div *ngIf="!showTable" class="d-flex" style="justify-content: center;">
    <img src="./assets/images/NOdata.png" alt="">
  </div>
</div>
</div>
