 <div class="table-responsive">
    <div class="row d-flex m-0" style="justify-content: right;" >
      <div class="form-group has-search col-sm-3">
        <button class="btn btn-secondary" type="button" style="z-index: 1001;
            position: absolute;
            background: none;
            top: -3px;
            width: 38px;
            height: 30px;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            background-color: #2e3f55;">
          <i class="fa fa-search" style="color:  #a3b8d4; margin-top: -24px;"></i>
        </button>
        <input type="text" class="form-control" placeholder="Search.."  id="Filter" #input (keyup)="applyFilter($event)"  style="border-radius: 11px; margin: 0px 0 0; box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px; height: 32px; padding-left: 48px;">
      </div>
    </div>
  </div>
  <!-- <div *ngIf="showTable && dataSource.data.length"> -->
    <div class="mat-elevation-z8 table-responsive text-nowrap">
      <table mat-table [dataSource]="dataSource" class="table-bordered table-striped">
  
        <ng-container *ngFor="let col of displayedColumns" [matColumnDef]="col">
          <th mat-header-cell *matHeaderCellDef> {{ columnHeaderMap[col] }} </th>
          <td mat-cell *matCellDef="let element"> {{element[col]}} </td>
        </ng-container>
  
        <!-- Action Column -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>
            <button mat-mini-fab color="primary" aria-label="Add" (click)="openCustmerCharForm()">
              <mat-icon>add</mat-icon>
            </button>
          </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Actions">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="openCustmerCharForm(element)" >
                <mat-icon style="color: green;">edit</mat-icon>
                <span style="color: green;">Edit</span>
              </button>
              <button mat-menu-item (click)="deleteFuelChrgData(element)">
                <mat-icon style="color: red;">delete</mat-icon>
                <span style="color: red;">Delete</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
      </table>
    </div>
    <mat-paginator [pageSizeOptions]="[10, 20]" showFirstLastButtons></mat-paginator>
  
  <!-- <hr class="m-0" style="border: 1px solid #9b9898;"> -->

  <div *ngIf="!showTable" class="d-flex justify-content-center">
    <img src="./assets/img/NOdata.png" alt="No data available">
  </div> -->
  <div *ngIf="dataSource.filteredData.length === 0" class="d-flex justify-content-center">
    <img src="./assets/images/NOdata.png" alt="No data available">
  </div>
