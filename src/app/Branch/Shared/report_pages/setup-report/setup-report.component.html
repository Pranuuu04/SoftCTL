<div class="container">
    <div class="row" style="border-bottom: 1px solid #d2d2d2;">
      <div class="col-sm-6">
        <h1 style="font-weight: 600; font-size: large; margin-bottom: 0; margin-top: 7px; ">Setup</h1>
      </div>
      <div class="col-sm-6 d-flex cancel" style="justify-content: right;">
        <button type="button" class="btn btn-light" (click)="CloseDialog()" style="width: 30px;text-align: center; line-height: 30px; height: 30px; font-weight: 500; font-size: large; background: red; color: white;">X</button>
      </div>
    </div>
    <div class="row">
      <div class="col-sm-12 report-setup-container">
         <form>
        <div class="row">
            <div class="col-sm-3 reportSetup " *ngFor="let key of reportSetup | keyvalue : keepOriginalOrder; trackBy: trackByKey">
                <mat-slide-toggle 
                [checked]="key.value === 1"
                (change)="toggleChanged(key.key, $event)">
                {{ columnMapping[key.key] || key.key }}
                </mat-slide-toggle>
            </div>
        </div>
  
    <div class="row form-group d-flex m-0" style="justify-content: right;">
    <div class="col-sm-4 d-flex" style="justify-content: right; padding-right: 0;" >
        <button type="button" class="btn btn-light other-button" (click)="saveAndClose()">Submit</button>
    </div>
    </div>
    </form>
      </div>
    </div>
   
</div>
