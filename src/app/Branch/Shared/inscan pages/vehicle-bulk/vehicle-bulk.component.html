<div class="container">
  <div class="row" style="border-bottom: 1px solid #d2d2d2;">
    <div class="col-sm-6">
      <h1 style="font-weight: 600;
      font-size: large;
      margin-bottom: 0;
      margin-top: 7px; ">Vehicle</h1>
    </div>
      <div class="col-sm-6 d-flex cancel"  style="justify-content: right;">
      <button type="button" class="btn btn-light" (click)="CloseDialog()" style="width: 30px;
      text-align: center;
      line-height: 30px;
      height: 30px;
      font-weight: 600;
      font-size: large;
      background: #a6bcbd;">X</button>
  </div>
  </div>
    <form class="mt-2">
      <div class="row">
        <label for="fdate" class="col-sm-1 col-form-label">From Date</label>
        <div class="col-sm-2">
          <input type="date" placeholder="date" class="form-control" id="fdate" formControlName="fdate" />
        </div>

        <label for="tdate" class="col-sm-1 col-form-label">To Date</label>
        <div class="col-sm-2">
          <input type="date" placeholder="date" class="form-control" id="tdate"  formControlName="tdate" />
        </div>
        <label for="fdst" class="col-sm-1 col-form-label">From Dst</label>
        <div class="col-sm-2">
          <input type="text" placeholder="From Dst" class="form-control" id="fdst"  formControlName="fdst" />
        </div>

        <label for="tdst" class="col-sm-1 col-form-label">To Dst</label>
        <div class="col-sm-2">
          <input type="text" placeholder="To Dst" class="form-control" id="tdst"  formControlName="tdst" />
        </div>
      </div>
      <div class="row d-flex m-0" style="justify-content: right;">
        <div class="col-sm-2 d-flex" style="justify-content: right; padding-right: 0;" >
          <button type="submit" class="btn btn-info" >Find</button>
        </div>
       </div>
     </form>


     <div class="table-responsive">
      <div class="row d-flex m-0">
        <div class="form-group has-search col-sm-3">
          <button class="btn btn-secondary" type="button" style="z-index: 1001;
          position: absolute;
          background: none;
          top: -1px;
          left: 21px;">
            <i class="fa fa-search" style="color: #d2d2d2;"></i>
          </button>
          <input type="text" class="form-control" placeholder="Search"  id="Filter" #input  (keyup)="applyFilter($event)" style="padding-left: 32px;">
        </div>
       </div>
    </div>
 <div class="table-responsive text-nowrap">
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table-bordered table-striped " style="background-color: rgb(215 244 255 / 87%);">

      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox (change)="$event ? toggleAllRows() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()"
                        [aria-label]="checkboxLabel()">
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox (click)="$event.stopPropagation()"
                        (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)"
                        [aria-label]="checkboxLabel(row)">
          </mat-checkbox>
        </td>
      </ng-container>
    
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef> position. </th>
            <td mat-cell *matCellDef="let element"> {{element.position}} </td>
          </ng-container>
      <ng-container matColumnDef="vehicleNo">
        <th mat-header-cell *matHeaderCellDef> Vehicle No. </th>
        <td mat-cell *matCellDef="let element"> {{element.vehicleNo}} </td>
      </ng-container>
 
      <ng-container matColumnDef="bookingDt">
        <th mat-header-cell *matHeaderCellDef> bookingDt </th>
        <td mat-cell *matCellDef="let element"> {{element.bookingDt}} </td>
      </ng-container>
    
      <ng-container matColumnDef="consignee">
        <th mat-header-cell *matHeaderCellDef> consignee </th>
        <td mat-cell *matCellDef="let element"> {{element.consignee}} </td>
      </ng-container>
    
      <ng-container matColumnDef="destination">
        <th mat-header-cell *matHeaderCellDef> destination </th>
        <td mat-cell *matCellDef="let element"> {{element.destination}} </td>
      </ng-container>
  
      <ng-container matColumnDef="pcs">
        <th mat-header-cell *matHeaderCellDef> pcs </th>
        <td mat-cell *matCellDef="let element"> {{element.pcs}} </td>
      </ng-container>
  
      <ng-container matColumnDef="weight">
        <th mat-header-cell *matHeaderCellDef> weight </th>
        <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
      </ng-container>
  
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          (click)="selection.toggle(row)">
      </tr>
    </table>
  </div>
 </div>
 <mat-paginator [pageSizeOptions]="[5, 10, 20]"
 showFirstLastButtons
 aria-label="Select page of periodic elements">
</mat-paginator>
   

     <div class="row" style="justify-content: right;">
       <div class="col-sm-3 d-flex" style=" justify-content: right;">
         <button type="button" class=" Unload btn btn-info">Unload</button>
       </div>
     </div>

 </div>
