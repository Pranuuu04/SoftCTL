    <div class="container">
        <div class="row" style="border-bottom: 1px solid #d2d2d2;">
          <div class="col-sm-6">
            <h1 style="font-weight: 600;
            font-size: large;
            margin-bottom: 0;
            margin-top: 7px; ">Customer</h1>
          </div>
            <div class="col-sm-6 d-flex cancel" style="justify-content: right;">
            <button type="button" class="btn btn-light" (click)="CloseDialog()" style="width: 30px;
            text-align: center;
            line-height: 30px;
            height: 30px;
            font-weight: 500;
            font-size: large;
            background: red;
            color: white;">X</button>
        </div>
        </div>
        <form   [formGroup]="vehicleForms" (ngSubmit)="submit(vehicleForms.value)">
              <div class="row">
                <div class="col-sm-12">
                    <div class="textOnInput">
                        <label for="vehicleType">Vehicle Type</label>
                        <input class="form-control" type="text" id="vehicleType" formControlName="vehicleType"  placeholder="enter vehicleType">
                      </div>
              </div>
    
              </div>
              <div class="row">
                <div class="col-sm-12">
                    <div class="textOnInput">
                        <label for="vehicleNo">Vehicle No</label>
                        <input class="form-control" type="text" id="vehicleNo" formControlName="vehicleNo"  placeholder="enter vehicleNo">
                      </div>
              </div>
              </div>
              <div class="row">
                <div class="col-sm-12">
                    <div class="textOnInput">
                        <label for="driverName">Driver Name </label>
                        <input class="form-control" type="text" id="driverName" formControlName="driverName"  placeholder="Enter driverName">
                      </div>
              </div>
              </div>
              <div class="row">
                <div class="col-sm-12">
                    <div class="textOnInput">
                        <label for="driverNo">Driver No</label>
                        <input class="form-control" type="number" id="driverNo" formControlName="driverNo"  placeholder="enter driverNo">
                      </div>
              </div>
              </div>
              <div class="row form-group d-flex m-0" style="justify-content: right;">
                <div class="col-sm-4 d-flex" style="justify-content: right; padding-right: 0;" >
                  <button type="submit" class="btn btn-light other-button">Submit</button>
                </div>
               </div>
            </form>
     </div>
