<div class="container">
    <div class="row" style="border-bottom: 1px solid #d2d2d2;">
      <div class="col-sm-6">
        <h1 style="font-weight: 600;
        font-size: large;
        margin-bottom: 0;
        margin-top: 7px; ">Delete Drs.</h1>
      </div>
        <div class="col-sm-6 d-flex cancel" style="justify-content: right;">
        <button type="button" class="btn btn-light" (click)="CloseDialog()" style="width: 30px;
        text-align: center;
        line-height: 30px;
        height: 30px;
        font-weight: 600;
        font-size: large;
        background: #a6bcbd;">X</button>
    </div>
    </div>
    <form  [formGroup]="CreateForm" >
      <div class="row">

      <div class="col-sm-6 d-flex" style="height: 30px; justify-content: center; right: 6px;">
          <input type="radio"id="huey" name="drone" value="huey" checked (click)="onCheckedAwb()">
          <label for="huey" class="huey" style="font-size: small;"> AWB No.</label>
      </div>

      <div class="col-sm-6 d-flex" style="height: 30px; justify-content: center;">
        <input type="radio" id="dewey" name="drone" value="dewey" (click)="onChecked()">
        <label for="dewey" class="dewey" style="font-size: small;">Drs No.</label>
      </div>
     </div>
         
          <div class="row">
            <div class="col-sm-12">
              <label for="DrsNo" class="col-form-label">Drs No.</label>
              <input type="number" placeholder="date" class="form-control" id="DrsNo" formControlName="DrsNo" placeholder="enter DrsNo" [hidden]="!manifestDisabled" readonly />
          </div>
          </div>
          <div class="row">
            <div class="col-sm-12">
              <label for="awbNo" class="col-form-label"  [hidden]="!awbDisabled">AWB No.</label>
              <input type="text" placeholder="date" class="form-control" id="awbNo" formControlName="awbNo"  placeholder="enter awbNo" [hidden]="!awbDisabled" />
          </div>
          </div>
          <div class="row d-flex m-0" style="justify-content: right;">
            <div class="col-sm-4 d-flex" style="justify-content: right; padding-right: 0;" >
              <button type="submit" class="btn btn-danger" (click)="confirmDeleteDrs()">Delete</button>
            </div>
           </div>
        </form>
 </div>
