<div class="container" style="margin: 0; max-width: 100%;">
    <div class="row Topbutton">
        <div class="col-sm-6">
          <h1 style="font-weight: 600; font-size: large; margin-bottom: 0; margin-top: 7px; ">Manifest Error Log</h1>
        </div>
      <div class="col-sm-5 d-flex cancel download-button" style="justify-content: space-around;">
        <button type="submit" class="btn btn-outline-light" (click)="generateExcel()"><i class="fa-solid fa-table"></i></button>
        <button type="button" class="btn btn-light" (click)="CloseDialog()" style="background: #a6bcbd;">X</button>
      </div>
    </div>
     <div *ngIf="showTable && dataSource.data.length > 0">
      <div class="table-responsive">
        <div class="row d-flex m-0" style="justify-content: right;" >
          <div class="form-group has-search col-sm-7">
            <button class="btn btn-secondary" type="button" style="z-index: 1001;
            position: absolute;
            background: none;
            top: -4px;
            width: 38px;
            height: 32px;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            background-color: orange;">
              <i class="fa fa-search" style="color: white; margin-top: -24px;"></i>
            </button>
            <input type="text" class="form-control" placeholder="Search.."  id="Filter" #input (keyup)="applyFilter($event.target.value)" style="border-radius: 11px; margin: 0px 0 0; box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px; height: 32px; padding-left: 48px;">
          </div>
         </div>
      </div>
      <div class="table-responsive text-nowrap">
        <table id="myTable" mat-table [dataSource]="dataSource" class="mat-elevation-z8 table-bordered table-striped " style="background-color: rgb(215 244 255 / 87%);" >
           																
          <ng-container matColumnDef="AwbForManifest">
            <th mat-header-cell *matHeaderCellDef>AwbNo </th>
            <td mat-cell *matCellDef="let element"> {{element.AwbForManifest}} </td>
          </ng-container>
            
          <ng-container matColumnDef="error">
            <th mat-header-cell *matHeaderCellDef> ERROR</th>
            <td mat-cell *matCellDef="let element"> {{element.error}} </td>
          </ng-container>  
     
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
          </tr>
        </table>
      
    </div>
    <mat-paginator [pageSizeOptions]="[5,10, 20]" showFirstLastButtons aria-label="Select page of periodic elements"> </mat-paginator>
     </div>
     <div *ngIf="!showTable" class="d-flex" style="justify-content: center;">
      <img src="./assets/images/NOdata.png" alt="">
      </div>
</div>
