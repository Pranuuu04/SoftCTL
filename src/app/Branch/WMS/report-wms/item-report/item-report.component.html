  <div *ngIf="showTable">
  <div class="table-responsive text-nowrap">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table-bordered table-striped" style="background-color: #e2e9f1;">
        
      <ng-container matColumnDef="S_no">
        <th mat-header-cell *matHeaderCellDef> S.No </th>
        <td mat-cell *matCellDef="let element"> {{ element.S_no }} </td>
      </ng-container>

      <!-- Category_Code Column -->
      <ng-container matColumnDef="Category_Code">
        <th mat-header-cell *matHeaderCellDef> Category Code </th>
        <td mat-cell *matCellDef="let element"> {{ element.Category_Code }} </td>
      </ng-container>

      <!-- Item_Code Column -->
      <ng-container matColumnDef="Item_Code">
        <th mat-header-cell *matHeaderCellDef> Item Code </th>
        <td mat-cell *matCellDef="let element"> {{ element.Item_Code }} </td>
      </ng-container>

      <!-- Item_Name Column -->
      <ng-container matColumnDef="Item_Name">
        <th mat-header-cell *matHeaderCellDef> Item Name </th>
        <td mat-cell *matCellDef="let element"> {{ element.Item_Name }} </td>
      </ng-container>

      <!-- Qty Column -->
      <ng-container matColumnDef="Qty">
        <th mat-header-cell *matHeaderCellDef> Quantity </th>
        <td mat-cell *matCellDef="let element"> {{ element.Qty }} </td>
      </ng-container>

      <!-- Rate Column -->
      <ng-container matColumnDef="Rate">
        <th mat-header-cell *matHeaderCellDef> Rate </th>
        <td mat-cell *matCellDef="let element"> {{ element.Rate }} </td>
      </ng-container>

      <!-- Volume Column -->
      <ng-container matColumnDef="Volume">
        <th mat-header-cell *matHeaderCellDef> Serial no. </th>
        <td mat-cell *matCellDef="let element"> {{ element.Volume }} </td>
      </ng-container>

  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
  <mat-paginator
  [length]="length"
  [pageSize]="pageSize"
  [pageSizeOptions]="pageSizeOptions"
  [pageIndex]="pageIndex"
  [showFirstLastButtons]="showFirstLastButtons"
  [hidePageSize]="hidePageSize"
  [disabled]="disabled"
  (page)="handlePageEvent($event)">
</mat-paginator>
</div>
<div *ngIf="!showTable" class="d-flex" style="justify-content: center;">
  <img src="./assets/images/NOdata.png" alt="">
</div>
