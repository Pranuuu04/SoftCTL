<div>
    <form [formGroup]="createForm" (ngSubmit)="generateTrip(createForm.value)">
      <div class="row mainrow">
        <div class="col-sm-3">
          <div class="textOnSelect">
              <label for="CustomerName"><span style="color: red;">*</span>Customer name :</label>
              <select class="custom-select" formControlName="CustomerName"  (change)="resetPagination()">
                <option value="All" selected>All Customer</option>
                <option *ngFor="let item of CustomerList" value="{{item.customerCode}}">
                  {{ item.customerName }} 
                </option>
              </select>
              <div *ngFor="let validation of validationMessage.CustomerName">
                <div class="error-message"
                  *ngIf="createForm.get('CustomerName').hasError(validation.type) && (createForm.get('CustomerName').dirty || createForm.get('CustomerName').touched)">
                  {{ validation.message }}
                </div>
              </div>
          </div>
        </div>
        <div class="col-sm-3">
            <div class="textOnSelect">
              <label for="Transporttype"><span style="color: red;">*</span>Transport :</label>
              <select id="Transporttype" class="custom-select" formControlName="Transporttype" (change)="onTransportTypeChange($event)">
                <option value="All" selected>All</option>
                <option value="Self">Self</option>
                <option value="Hired">Hired</option>
              </select>
              <div *ngFor="let validation of validationMessage.Transporttype">
                <div class="error-message"
                  *ngIf="createForm.get('Transporttype').hasError(validation.type) && (createForm.get('Transporttype').dirty || createForm.get('Transporttype').touched)">
                  {{ validation.message }}
                </div>
              </div>
          </div>
         </div>
          <div class="col-sm-3">
            <div class="textOnInput">
              <label for="VehicleNo"><span style="color: red;">*</span>Vehicle No. :</label>
              <select id="VehicleNo" class="custom-select" formControlName="VehicleNo" (change)="resetPagination()">
                <option value="All" selected>All Numbers</option>

              <option *ngFor="let vehicle of vehicleNumbers" value="{{vehicle.vehicleReg}}">{{ vehicle.vehicleReg }}</option>
            </select>
            <div *ngFor="let validation of validationMessage.VehicleNo">
              <div class="error-message"
                *ngIf="createForm.get('VehicleNo').hasError(validation.type) && (createForm.get('VehicleNo').dirty || createForm.get('VehicleNo').touched)">
                {{ validation.message }}
              </div>
            </div>
          </div>
          </div>
          <div class="col-sm-2">
            <div class="textOnInput">
              <label for="Status"><span style="color: red;">*</span>Status :</label>
              <select id="Status" class="custom-select" formControlName="Status" (change)="resetPagination()">
                <option value="All" selected>All</option>
              <option  value="Open">Open</option>
              <option value="Close">Close</option>
            </select>
          </div>
          </div>
          <div class="col-sm-1 download-buttons" (click)="generatePdf()">
            <button type="button" class="btn btn-outline-light pb-0"><i class="fa-solid fa-file-pdf"></i>
              <span class="text">PDF</span></button>
          </div>
      </div>
      <div class="row mainrow" style="border-bottom: 1px solid #d2d2d2;">
        <div class="col-sm-3">
            <div class="textOnInput">
              <label for="fromDate">From :</label>
              <input class="form-control" type="date" formControlName="fromDate"  [(ngModel)]="fromDate"  [value]="getDefaultDate()" id="fromDate">
              <div *ngFor="let validation of validationMessage.fromDate">
                <div class="error-message"
                  *ngIf="createForm.get('fromDate').hasError(validation.type) && (createForm.get('fromDate').dirty || createForm.get('fromDate').touched)">
                  {{ validation.message }}
                </div>
              </div>
          </div>
          </div>
          <div class="col-sm-3">
            <div class="textOnInput">
              <label for="toDate">To :</label>
              <input class="form-control" type="date" formControlName="toDate"  [(ngModel)]="toDate"  [value]="getCurrentDate()" id="toDate">
              <div *ngFor="let validation of validationMessage.toDate">
                <div class="error-message"
                  *ngIf="createForm.get('toDate').hasError(validation.type) && (createForm.get('toDate').dirty || createForm.get('toDate').touched)">
                  {{ validation.message }}
                </div>
              </div>
          </div>
          </div>
          <div class="col-sm-5"></div>
          <div class="col-sm-1 download-buttons">
            <button type="button" class="btn btn-outline-light pb-0" (click)="downloadSample()"><i
                class="fa-solid fa-table"></i>
              <span class="text">XLs</span></button>
          </div>
                
      </div>
    
      <div class="row mainrow" style="border-bottom: 1px solid #d2d2d2; margin: 10px 0;">
        <div class="col-sm-3">
         </div>
        <div class="col-sm-6">
         
        </div>
        <div class="col-sm-3 d-flex" style="justify-content: end;" >
          <button type="submit" class="btn btn-light other-button">Submit</button>
        </div>
      </div>
    </form> 
  </div>
