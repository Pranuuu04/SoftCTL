 <!-- <div *ngIf="showTable && dataSource.data.length > 0"> -->
    <div class="table-responsive">
        <div class="row d-flex m-0" style="justify-content: right;" >
          <div class="form-group has-search col-sm-3">
            <button class="btn btn-secondary" type="button" style="z-index: 1001;
            position: absolute;
            background: none;
            top: -3px;
            width: 38px;
            height: 30px;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            background-color: #2e3f55;">
              <i class="fa fa-search" style="color:  #a3b8d4; margin-top: -24px;"></i>
            </button>
            <input type="text" class="form-control" placeholder="Search.."  id="Filter" #input (keyup)="applyFilter($event.target.value)" style="border-radius: 11px; margin: 0px 0 0; box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px; height: 32px; padding-left: 48px;">
          </div>
        </div>
      </div>
      <div class="table-responsive text-nowrap">
          <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table-bordered table-striped" style="background-color: #e2e9f1;">
            
            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef> 
                <button mat-mini-fab color="primary" aria-label="Example icon button with a menu icon" (click)="openWalletEntryForm(element)">
                  <mat-icon>add</mat-icon>
                </button> </th>
              <td mat-cell *matCellDef="let element">
                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                  <button mat-menu-item  (click)="deleteWalletEntry(element)">
                    <mat-icon>delete</mat-icon>
                    <span>Delete</span>
                  </button>
                </mat-menu>
                
              </td>
            </ng-container>
    
          <ng-container matColumnDef="ID">
            <th mat-header-cell *matHeaderCellDef> ID </th>
            <td mat-cell *matCellDef="let element"> {{ element.ID }} </td>
          </ng-container>

          <ng-container matColumnDef="Date">
            <th mat-header-cell *matHeaderCellDef> Date </th>
            <td mat-cell *matCellDef="let element"> {{ element.Date }} </td>
          </ng-container>

          <ng-container matColumnDef="customerName">
            <th mat-header-cell *matHeaderCellDef> Customer name </th>
            <td mat-cell *matCellDef="let element"> {{ element.customerName }} </td>
          </ng-container>

          <ng-container matColumnDef="Amount">
            <th mat-header-cell *matHeaderCellDef> Amount </th>
            <td mat-cell *matCellDef="let element"> {{ element.Amount }} </td>
          </ng-container>

          <ng-container matColumnDef="PaymentMode">
            <th mat-header-cell *matHeaderCellDef> Payment mode </th>
            <td mat-cell *matCellDef="let element"> {{ element.PaymentMode }} </td>
          </ng-container>

          <ng-container matColumnDef="Remark">
            <th mat-header-cell *matHeaderCellDef> Remark </th>
            <td mat-cell *matCellDef="let element"> {{ element.Remark }} </td>
          </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <!-- <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr> -->
        
            <!-- ✅ Data rows (only if showTable and has data) -->
            <ng-container *ngIf="showTable && dataSource.data.length > 0">
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </ng-container>

            <!-- ✅ No data row -->
            <ng-container *ngIf="!showTable || dataSource.data.length === 0">
              <tr>
                <td [attr.colspan]="displayedColumns.length" class="text-center">
                  <img src="./assets/images/NOdata.png"/>
                  <div>No Records Found</div>
                </td>
              </tr>
            </ng-container>
          </table>
      </div>
<mat-paginator
  [length]="length"
  [pageSize]="pageSize"
  [pageIndex]="pageIndex"
  [showFirstLastButtons]="showFirstLastButtons"
  [hidePageSize]="hidePageSize"
  [disabled]="disabled"
  (page)="handlePageEvent($event)">
</mat-paginator>
