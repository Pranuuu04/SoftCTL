<form [formGroup]="filterForm" (ngSubmit)="onFilterSubmit()">
    <div class="row mainrow mt-4" style="border-bottom: 1px solid #d2d2d2;">
      <div class="col-sm-4">
        <div class="textOnSelect">
          <label for="rateCustomer"><span style="color: red;">*</span>Customer Name :</label>
          <ng-select
            [items]="customerList"
            class="custom-select1"
            bindLabel="customerName"
            bindValue="customerCode"
            formControlName="rateCustomer">
          </ng-select>
        </div>
      </div>

      <div class="col-sm-2">
        <div class="textOnInput">
          <label for="fromDate"><span style="color: red;">*</span>From date :</label>
          <input class="form-control" type="date" id="fromDate" formControlName="fromDate"  [value]="getDefaultDate()" [(ngModel)]="fromDate" >
        </div>
      </div>

       <div class="col-sm-2">
        <div class="textOnInput">
          <label for="fromDate"><span style="color: red;">*</span>To date :</label>
          <input class="form-control" type="date" id="toDate" formControlName="toDate"  [value]="getDefaultDate()" [(ngModel)]="toDate" >
        </div>
      </div> 

      <div class="col-sm-2">
        <div class="textOnInput">
          <label for="AwbNo">AwbNo :</label> <!--<span style="color: red;">*</span>-->
          <input class="form-control" type="text" formControlName="AwbNo">
        </div>
      </div>
       <!-- <div class="col-sm-2">
        <div class="textOnInput">
          <label for="Amount">Amount :</label>
          <input class="form-control" type="number" min="0" formControlName="Amount">
        </div>
      </div> -->
        <div class="col-sm-2 d-flex" style="justify-content: right;" >
        <button type="submit" class="btn btn-light other-button">Submit</button>
      </div>
    </div>
  </form>

<!-- <div *ngIf="showTable && dataSource.data.length > 0"> -->
    <div class="table-responsive">
      <div class="row d-flex m-0" style="justify-content: right;">
        <div class="form-group has-search col-sm-3" style="margin: 14px 0 0;">
          <button class="btn btn-secondary" type="button" style="z-index: 1001;
            position: absolute;
            background: none;
            top: -4px;
            width: 38px;
            height: 30px;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            background-color: #2e3f55;">
            <i class="fa fa-search" style="color: #a3b8d4; margin-top: -24px; margin-left: 1px;"></i>
          </button>
          <input type="text" class="form-control" #input (keyup)="applyFilter($event.target.value)" placeholder="Search.." id="Filter" style="border-radius: 11px; margin: 0px 0 0; box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px; height: 32px; padding-left: 48px;">
        </div>
      </div>
    </div>
      <div class="table-responsive text-nowrap">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table-bordered table-striped " style="background-color: #e2e9f1;" matSort>

      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let element" class="text-center">

        </button> -->
          <button mat-menu-item  (click)="openCashTopayForm('add',element)" class="text-center">
            <mat-icon color="primary" class="text-center">add</mat-icon>
            <!-- <span>Add</span> -->
          </button>

        <!-- <mat-menu #rowMenu="matMenu">

    <ng-container matColumnDef="AwbNo">
      <th mat-header-cell *matHeaderCellDef>AWB No</th>
      <td mat-cell *matCellDef="let element">{{ element.AwbNo }}</td>
    </ng-container>

    <ng-container matColumnDef="BookDate">
     <th mat-header-cell *matHeaderCellDef>Book Date</th>
     <td mat-cell *matCellDef="let element">{{ element.BookDate | date:'dd/MM/yyyy'  }}</td>
   </ng-container>

  <ng-container matColumnDef="SGSTAmt">
    <th mat-header-cell *matHeaderCellDef> GST Amt</th>
    <td mat-cell *matCellDef="let element">{{ element.SGST }}</td>
  </ng-container>

  <!-- Total Amt -->
  <ng-container matColumnDef="TotalAmt">
    <th mat-header-cell *matHeaderCellDef>Total Amt</th>
    <td mat-cell *matCellDef="let element">{{ element.TotalAmt }}</td>
  </ng-container>

   <ng-container matColumnDef="ReceivedAmt">
    <th mat-header-cell *matHeaderCellDef>Received Amt</th>
    <td mat-cell *matCellDef="let element">{{ element.ReceivedAmt }}</td>
  </ng-container>

   <ng-container matColumnDef="Outstanding">
    <th mat-header-cell *matHeaderCellDef>Outstanding</th>
    <td mat-cell *matCellDef="let element">{{ element.PaymentOutstand }}</td>
  </ng-container>

  <ng-container matColumnDef="Remark">
    <th mat-header-cell *matHeaderCellDef>Remark</th>
    <td mat-cell *matCellDef="let element">{{ element.Remark }}</td>
  </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      </div>
   <mat-paginator
    [length]="length"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="pageSizeOptions"
    [showFirstLastButtons]="true"
    (page)="handlePageEvent($event)">
  </mat-paginator>
