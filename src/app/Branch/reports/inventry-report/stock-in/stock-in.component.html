  <div>
    <form [formGroup]="stockInForm" (ngSubmit)="formSubmit(stockInForm.value)">
    <div class="row mainrow" style="border-bottom: 1px solid #d2d2d2;">
      
            <div class="col-sm-2">
                <div class="textOnInput">
                    <label for="fromDate">From :</label>
                    <input class="form-control" type="date" formControlName="fromDate"  [(ngModel)]="fromDate"  [value]="getDefaultDate()" id="fromDate">
                </div>
            </div>   
              <div class="col-sm-2">
                <div class="textOnInput">
                    <label for="toDate">To :</label>
                    <input class="form-control" type="date" formControlName="toDate"  [(ngModel)]="toDate"  [value]="getCurrentDate()" id="toDate">
                </div>
            </div>
          
                </div>
            <div class="row mainrow" style="justify-content: right; border-bottom: 1px solid #d2d2d2;">
          <div class="col-sm-5">
            <div class="row">              
                  <div class="col-sm-9 d-flex  pr-0" style="justify-content: end;">
                    <button type="submit" class="btn btn-light other-button">Submit</button>
                  </div>
                  <div class="col-sm-3 download-buttons d-flex pl-0" style="justify-content: end;">
                      <button type="button" class="btn btn-outline-light pb-0 mt-0" (click)="downloadSample()"><i
                          class="fa-solid fa-table"></i>
                        <span class="text">XLs</span></button>
                          <button type="button" class="btn btn-outline-light pb-0 mt-0" disabled><i class="fa-solid fa-file-pdf"></i>
                        <span class="text">PDF</span></button>
                        </div>
                  </div>
                </div>
                  </div>
             </form>
          </div>


<div *ngIf="enabledTable"  #TABLE>
  <div class="table-responsive text-nowrap" >
    <div class="mat-elevation-z8" >
      <table  id="genPDF" mat-table [dataSource]="dataSource" class="table-bordered table-striped " style="background-color: rgb(223 233 237 / 87%);" matSort >
      <ng-container matColumnDef="srNo">
          <th mat-header-cell *matHeaderCellDef> Sr. No. </th>
          <td mat-cell *matCellDef="let element; let i = index"> {{i + 1}} </td>
        </ng-container>

        <ng-container matColumnDef="BookNo">
          <th mat-header-cell *matHeaderCellDef> Book No </th>
          <td mat-cell *matCellDef="let element"> {{element.BookNo}} </td>
        </ng-container>

        <ng-container matColumnDef="AwbFromNo">
          <th mat-header-cell *matHeaderCellDef> From Awb No </th>
          <td mat-cell *matCellDef="let element"> {{element.AwbFromNo}} </td>
        </ng-container>

        <ng-container matColumnDef="AwbToNo">
          <th mat-header-cell *matHeaderCellDef> To Awb No </th>
          <td mat-cell *matCellDef="let element"> {{element.AwbToNo}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>
    </div>
  </div>

    <mat-paginator 
        (page)="handlePageEvent($event)"
        [length]="length"
        [pageSize]="pageSize"
        [disabled]="disabled"
        [showFirstLastButtons]="showFirstLastButtons"
        [pageSizeOptions]="showPageSizeOptions ? pageSizeOptions : [5, 10, 20]"
        [hidePageSize]="hidePageSize"
        [pageIndex]="pageIndex">
    </mat-paginator>
    <div style="justify-content: right; display: flex; margin-right: 16px; color: black; font-size: 12px;">Page: {{ pageIndex + 1 }} of {{ pageCount }}</div>
  </div>

  <div id="displayValues" [hidden]="isHidden">Selected values: </div>
<div *ngIf="!enabledTable" class="d-flex" style="justify-content: center;">
  <img src="./assets/images/NOdata.png" alt="No data">
</div>
