               <div class="col-sm-2">
            <div class="textOnSelect">
                <label for="Type">Stock issue :</label>
                  <select class="custom-select" formControlName="stockIssue" 
            (change)="onStockIssueChange()">
                <option value="Branch" selected>Branch</option>
                <option value="Customer"> Customer</option>   
                <option value="Employee"> Employee</option>
                <!-- <option value="Employee"> franchisee</option> -->
              </select>
            </div>
        </div>
        <div class="col-sm-4" *ngIf="missingCNoteForm.get('stockIssue')?.value === 'Branch'">
  <div class="textOnSelect">
    <label>Branch :</label>
    <ng-select
      [items]="branchList"
      class="custom-select1"
      bindLabel="locationName"
      bindValue="locationCode"
      formControlName="branch">
    </ng-select>
  </div>
</div>

<!-- Customer dropdown -->
<div class="col-sm-4" *ngIf="missingCNoteForm.get('stockIssue')?.value === 'Customer'">
  <div class="textOnSelect">
    <label>Customer name :</label>
    <ng-select
      [items]="customerList"
      class="custom-select1"
      bindLabel="customerName"
      bindValue="customerCode"
      formControlName="customerName"
      (change)="resetPagination()">
    </ng-select>
  </div>
</div>

<!-- Employee dropdown -->
<div class="col-sm-4" *ngIf="missingCNoteForm.get('stockIssue')?.value === 'Employee'">
  <div class="textOnSelect">
    <label>Employee :</label>
    <ng-select
      [items]="employeeList"
      class="custom-select1"
      bindLabel="employeeName"
      bindValue="employeeCode"
      formControlName="employee">
    </ng-select>
  </div>
</div>

<div *ngIf="enabledTable"  #TABLE>
  <div class="table-responsive text-nowrap" >
    <div class="mat-elevation-z8" >
      <table  id="genPDF" mat-table [dataSource]="dataSource" class="table-bordered table-striped " style="background-color: rgb(223 233 237 / 87%);" matSort >
      <ng-container matColumnDef="srNo">
          <th mat-header-cell *matHeaderCellDef> Sr. No. </th>
          <td mat-cell *matCellDef="let element; let i = index"> {{i + 1}} </td>
        </ng-container>

        <ng-container matColumnDef="MissingAwbNo">
          <th mat-header-cell *matHeaderCellDef> Missing Awb No </th>
          <td mat-cell *matCellDef="let element"> {{element.MissingAwbNo}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>
    </div>
  </div>

    <mat-paginator 
        (page)="handlePageEvent($event)"
        [length]="length"
        [pageSize]="pageSize"
        [disabled]="disabled"
        [showFirstLastButtons]="showFirstLastButtons"
        [pageSizeOptions]="showPageSizeOptions ? pageSizeOptions : [5, 10, 20]"
        [hidePageSize]="hidePageSize"
        [pageIndex]="pageIndex">
    </mat-paginator>
    <div style="justify-content: right; display: flex; margin-right: 16px; color: black; font-size: 12px;">Page: {{ pageIndex + 1 }} of {{ pageCount }}</div>
  </div>

  <div id="displayValues" [hidden]="isHidden">Selected values: </div>
<div *ngIf="!enabledTable" class="d-flex" style="justify-content: center;">
  <img src="./assets/images/NOdata.png" alt="No data">
</div>
