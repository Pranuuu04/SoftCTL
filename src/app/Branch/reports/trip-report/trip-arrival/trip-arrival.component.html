<div>
    <form [formGroup]="createForm" (ngSubmit)="generateTrip(createForm.value)">
      <div class="row mainrow">
        <div class="col-sm-5">
          <div class="textOnSelect">
              <label for="CustomerName">Customer name :</label>
                <ng-select
                  [items]="CustomerList"
                  class="custom-select1"
                  bindLabel="customerName"
                  bindValue="customerCode"
                  formControlName="CustomerName"
                  (change)="resetPagination()">
                </ng-select>
              <div *ngFor="let validation of validationMessage.CustomerName">
                <div class="error-message"
                  *ngIf="createForm.get('CustomerName').hasError(validation.type) && (createForm.get('CustomerName').dirty || createForm.get('CustomerName').touched)">
                  {{ validation.message }}
                </div>
              </div>
          </div>
        </div>
          <div class="col-sm-3">
            <div class="textOnInput">
                  <label for="supplierName">Supplier name :</label>
          <ng-select 
           class="custom-select1"
            [items]="supplierList"
            bindLabel="shipperName"
            bindValue="shipperCode"
            formControlName="supplierName"
            [searchable]="true"
            [clearable]="true">
          </ng-select>
          </div>
          </div>
                 <div class="col-sm-3">
            <div class="textOnInput">
              <label for="VehicleNo"><span style="color: red;">*</span>Vehicle No. :</label>
                 <ng-select
                  [items]="vehicleNumbers"
                  class="custom-select1"
                  bindLabel="vehicleReg"
                  bindValue="vehicleReg"
                  formControlName="VehicleNo"
                  (change)="resetPagination()">
                </ng-select>
            <div *ngFor="let validation of validationMessage.VehicleNo">
              <div class="error-message"
                *ngIf="createForm.get('VehicleNo').hasError(validation.type) && (createForm.get('VehicleNo').dirty || createForm.get('VehicleNo').touched)">
                {{ validation.message }}
              </div>
            </div>
          </div>
          </div>
          <!-- <div class="col-sm-2"></div> -->
          <div class="col-sm-1 download-buttons" (click)="generatePdf()">
            <button type="button" class="btn btn-outline-light pb-0 mt-0"><i class="fa-solid fa-file-pdf"></i>
              <span class="text">PDF</span></button>
          </div>
      </div>
      <div class="row mainrow" style="border-bottom: 1px solid #d2d2d2;">
        
           <div class="col-sm-2">
            <div class="textOnInput">
              <label for="tripNo">Trip No. :</label>
              <input class="form-control" type="number" formControlName="tripNo" (change)="resetPagination()">
          </div>
          </div>
        <div class="col-sm-2">
            <div class="textOnInput">
              <label for="fromDate">From :</label>
              <input class="form-control" type="date" formControlName="fromDate"  [(ngModel)]="fromDate"  [value]="getDefaultDate()" id="fromDate" (change)="resetPagination()">
              <div *ngFor="let validation of validationMessage.fromDate">
                <div class="error-message"
                  *ngIf="createForm.get('fromDate').hasError(validation.type) && (createForm.get('fromDate').dirty || createForm.get('fromDate').touched)">
                  {{ validation.message }}
                </div>
              </div>
          </div>
          </div>
          <div class="col-sm-2">
            <div class="textOnInput">
              <label for="toDate">To :</label>
              <input class="form-control" type="date" formControlName="toDate"  [(ngModel)]="toDate"  [value]="getCurrentDate()" id="toDate" (change)="resetPagination()">
              <div *ngFor="let validation of validationMessage.toDate">
                <div class="error-message"
                  *ngIf="createForm.get('toDate').hasError(validation.type) && (createForm.get('toDate').dirty || createForm.get('toDate').touched)">
                  {{ validation.message }}
                </div>
              </div>
          </div>
          </div>
           <div class="col-sm-2">
            <div class="textOnInput">
              <label for="Status"><span style="color: red;">*</span>Status :</label>
              <select id="Status" class="custom-select" formControlName="Status" (change)="resetPagination()">
                <option value="All" selected>All</option>
              <option  value="Pending">Pending</option>
              <option value="Done">Done</option>
            </select>
          </div>
          </div>
             <div class="col-sm-3">
            <div class="textOnInput">
              <label for="Time"><span style="color: red;">*</span>Time :</label>
              <select id="Time" class="custom-select" formControlName="Time" (change)="resetPagination()">
              <option  value="Reporting" selected>Reporting time</option>
              <option value="LoadingOut">Loading out</option>
              <option value="LoadingIn">Loading In</option>
              <option value="Dispatch">Dispatch time</option>
              <option  value="InTransit">InTransit</option>
              <option  value="StoreIn">Store in</option>
              <option value="StoreOut">Store out</option>
            </select>
          </div>
          </div>
          <div class="col-sm-1 download-buttons">
            <button type="button" class="btn btn-outline-light pb-0 mt-0" (click)="downloadSample()" [disabled]="!showTable"><i
                class="fa-solid fa-table"></i>
              <span class="text">XLs</span></button>
          </div>
                
      </div>
    
      <div class="row mainrow" style="border-bottom: 1px solid #e6c6c6; margin: 10px 0;">
        <div class="col-sm-8">
        </div>
         <!-- <div class="col-sm-3 d-flex" style="justify-content: end;" >
        </div> -->
        <div class="col-sm-3 d-flex" style="justify-content: end;" >
          <!-- <i class="fa-regular fa-sliders"></i> -->
          <!-- <button type="button" class="btn btn-light other-button" (click)="openSetup()">Setup</button> -->
          <button type="submit" class="btn btn-light other-button">Submit</button>
        </div>
         <div class="col-sm-1 download-buttons"> 
          <button type="button" class="btn btn-outline-light pb-0 mt-0" (click)="openSetup()">
            <i class="fa-solid fa-sliders" style="color: darkslateblue; font-size: medium;"></i>
            <span class="text">Setup</span></button>
             <!-- style="background-color:#4a7bd1" -->
        </div>
      </div>
    </form> 
  </div>
  <div *ngIf="showTable">
  <div class="table-responsive text-nowrap">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table-bordered table-striped" style="background-color: #e2e9f1;">
    <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef>
        {{ columnMapping[column] || column }}
      </th>

      <td mat-cell *matCellDef="let element; let i = index">
        <ng-container *ngIf="column === 'index'">
          {{ pageIndex * pageSize + i + 1 }}
        </ng-container>

        <ng-container *ngIf="column === 'Action'">
          <mat-icon matTooltip="View Image" (click)="viewImage(element.Image1)" style="color: rgb(108, 114, 226)">image</mat-icon>
          <mat-icon matTooltip="View Image" (click)="viewImage(element.Image2)" style="color: rgb(108, 114, 226)">image</mat-icon>
          <mat-icon matTooltip="View Image" (click)="viewImage(element.Image3)" style="color: rgb(108, 114, 226)">image</mat-icon>
        </ng-container>

        <ng-container *ngIf="column !== 'index' && column !== 'Action'">
          {{ element[column] }}
        </ng-container>
      </td>
    </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
