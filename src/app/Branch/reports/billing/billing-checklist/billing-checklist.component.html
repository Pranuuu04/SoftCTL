<div class="statement-box">
  <form [formGroup]="checkListRegisterForm" (ngSubmit)="formSubmit(checkListRegisterForm.value)">

    <!-- ======================= ROW 1 ======================= -->
    <div class="row mainrow">

      <!-- Customer Name -->
      <div class="col-sm-4">
        <div class="textOnSelect">
          <label>Customer Name :</label>
            <ng-select [items]="customerList" bindLabel="customerName" bindValue="customerCode" class="custom-select1"
             formControlName="customerName" [(ngModel)]="customerName">
           </ng-select>
        </div>
      </div>

      <!-- Type -->
      <div class="col-sm-3">
        <div class="textOnSelect">
          <label>Type :</label>
          <select class="custom-select" formControlName="custType" [(ngModel)]="custType">
            <option value="All">All</option>
            <option value="CR">Credit</option>
            <option value="CRD">CreditCard</option>
            <option value="ToPay">ToPay</option>
            <option value="COD">COD</option>
            <option value="FOC">FOC</option>
            <option value="NEFT">NEFT</option>
            <option value="Cheque">Cheque</option>
          </select>
        </div>
      </div>

      <!-- Mode -->
      <div class="col-sm-3">
        <div class="textOnSelect">
          <label>Mode :</label>
            <ng-select [items]="modeList" bindLabel="Mode_name" bindValue="Mode_code" class="custom-select1"
              formControlName="modeName" [(ngModel)]="modeName">
            </ng-select>
        </div>
      </div>

      <!-- Report Type (Details radio replaced with select for clean UI) -->
      <div class="col-sm-2">
        <div class="textOnSelect">
          <label>Report Type :</label>
          <select class="custom-select" formControlName="bookingType" [(ngModel)]="bookingType">
            <option value="Details">Details</option>
            <option value="Summary">Summary</option>
          </select>
        </div>
      </div>

    </div>

    <div class="row mainrow border-row" style="border-bottom: 1px solid #d2d2d2;">

      <!-- From Date -->
      <div class="col-sm-3">
        <div class="textOnInput">
          <label>From Date :</label>
          <input type="date" class="form-control" formControlName="fromDate" [(ngModel)]="fromDate">
        </div>
      </div>

      <!-- To Date -->
      <div class="col-sm-3">
        <div class="textOnInput">
          <label>To Date :</label>
          <input type="date" class="form-control" formControlName="toDate" [(ngModel)]="toDate">
        </div>
      </div>

    </div>

    <!-- ======================= ROW 3 — BUTTONS ======================= -->
        <div class="row mainrow" style="justify-content: right; border-bottom: 1px solid #d2d2d2;">
          <div class="col-sm-5">
            <div class="row">              
            <div class="col-sm-8 d-flex  pr-0" style="justify-content: end;">
              <button type="submit" class="btn btn-light other-button">Submit</button>
            </div>
            <div class="col-sm-4 download-buttons d-flex pl-0" style="justify-content: end;">
                <button type="button" class="btn btn-outline-light pb-0 mt-0" (click)="openSetup()">
                    <i class="fa-solid fa-sliders" style="color: darkslateblue; font-size: medium;"></i>
                    <span class="text">Setup</span></button>
                <button type="button" class="btn btn-outline-light pb-0 mt-0" (click)="downloadSample()"><i
                    class="fa-solid fa-table"></i>
                  <span class="text">XLs</span></button>
                    <button type="button" class="btn btn-outline-light pb-0 mt-0" (click)="downloadSample()"><i class="fa-solid fa-file-pdf"></i>
                  <span class="text">PDF</span></button>
              </div>
            </div>
          </div>
        </div>

  </form>
</div>

 <div *ngIf="enabledTable" #TABLE>

    <div class="table-responsive text-nowrap" >
      <div class="mat-elevation-z8" >
        <table mat-table [dataSource]="dataSource" class="table-bordered table-striped " style="background-color: rgb(223 233 237 / 87%);" matSort >

        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">

          <th mat-header-cell *matHeaderCellDef>
            {{ displayedColumnsCheckList[column] || column }}
          </th>

          <td mat-cell *matCellDef="let element; let i = index">

            <!-- SR NO -->
            <ng-container *ngIf="column === 'index'">
              {{ pageIndex * pageSize + i + 1 }}
            </ng-container>

            <!-- NORMAL COLUMNS -->
            <ng-container *ngIf="column !== 'index'">
              {{ element[column] }}
            </ng-container>

          </td>

        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef> Action </th>
          <td mat-cell *matCellDef="let element" >
            <i class="fa fa-trash" style="color: #ef5350;"></i>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator #paginator
            class="demo-paginator"
            (page)="handlePageEvent($event)"
            [length]="length"
            [pageSize]="pageSize"
            [disabled]="disabled"
            [showFirstLastButtons]="showFirstLastButtons"
            [pageSizeOptions]="showPageSizeOptions ? pageSizeOptions : [5, 10, 20]"
            [hidePageSize]="hidePageSize"
            [pageIndex]="pageIndex"
            aria-label="Select page">
        </mat-paginator>
     </div>
    </div>
 
  </div>
