<div style="margin-left: 20px; margin-right: 20px;">
    <div class="card">
      <div class="card-body">
        <div class="container" style="padding: 1px;">
          <form>
            <div class="row">
              <label for="fromDate" class="col-sm-1 col-form-label" style="color: black;">From</label>
              <div class="col-sm-2">
                <input [value]="getDefaultDate()" type="date" formControlName="fromDate" class="form-control" id="fromDate" style="border: 1px solid #d2d2d2; border-radius: 0.25rem; color: black;margin-right: 3rem;margin-left: -2rem; height: 2rem; ">
              </div>
              <label for="toDate" class="col-sm-1 col-form-label" style="color: black;">To</label>
              <div class="col-sm-2">
                <input [value]="getCurrentDate()" type="date" formControlName="toDate" id="toDate" style="border: 1px solid #d2d2d2; border-radius: 0.25rem;color: black; margin-right: 3rem; margin-left: -3rem; height: 2rem; ">
              </div>
  
              <label for="inputEmail3" class="col-sm-2 col-form-label" style="color: black;">Customer_Name</label>
              <div class="col-sm-2">
                <input list="inputDestination" formControlName="destination"  class="custom-select" style=" color: black; margin-right: 3rem; margin-left: -3rem;width: 21rem;height: 2rem; ">
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  
  <div class="mat-elevation-z8 table-container" >
    <div class="small-input">
      <mat-icon>search</mat-icon>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Neotech" #input >
    </div>
  
  
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" class="table-bordered table-striped ">
  
     <ng-container matColumnDef="Bill_No">
        <th mat-header-cell *matHeaderCellDef> Bill_No </th>
        <td mat-cell *matCellDef="let element"> {{element.Bill_No}} </td>
      </ng-container>
  
      <ng-container matColumnDef="Bill_Date">
        <th mat-header-cell *matHeaderCellDef> Bill_Date </th>
        <td mat-cell *matCellDef="let element"> {{element.Bill_Date}} </td>
      </ng-container>
  
      <ng-container matColumnDef="Customer_Name">
        <th mat-header-cell *matHeaderCellDef> Customer_Name </th>
        <td mat-cell *matCellDef="let element"> {{element.Customer_Name}} </td>
      </ng-container>
      
  
    
      <ng-container matColumnDef="Count_Of_AWBNo">
        <th mat-header-cell *matHeaderCellDef> Count_Of_AWBNo </th>
        <td mat-cell *matCellDef="let element"> {{element.Count_Of_AWBNo}} </td>
      </ng-container>
  
     
      
      
      <ng-container matColumnDef="Count_Of_Pics">
        <th mat-header-cell *matHeaderCellDef> Count_Of_Pics </th>
        <td mat-cell *matCellDef="let element"> {{element.Count_Of_Pics}} </td>
      </ng-container>
  
      <ng-container matColumnDef="Amt">
        <th mat-header-cell *matHeaderCellDef> Amt </th>
        <td mat-cell *matCellDef="let element"> {{element.Amt}} </td>
      </ng-container>
  
      <ng-container matColumnDef="GST">
        <th mat-header-cell *matHeaderCellDef> GST </th>
        <td mat-cell *matCellDef="let element"> {{element.GST}} </td>
      </ng-container>
  
      <ng-container matColumnDef="Total_Amt">
        <th mat-header-cell *matHeaderCellDef> Total_Amt </th>
        <td mat-cell *matCellDef="let element"> {{element.Total_Amt}} </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons
                   aria-label="Select page of periodic elements">
    </mat-paginator>
  </div>
